[project]
name = "switch-vox-core"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "orjson>=3.13.0",
    "pydantic-settings>=2.16.2",
    "pysilero-vad==3.4.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["sources"]
addopts = "-ra"

[tool.coverage.run]
source = ["sources"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py315"
line-length = 200
src = ["sources", "test"]

[tool.ruff.per-file-target-version]
"deploy/asr/**/*.py" = "py312"
"deploy/cosyvoice/**/*.py" = "py310"
"deploy/llm/**/*.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.15"
mypy_path = "sources"
explicit_package_bases = true
files = ["sources", "test"]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
